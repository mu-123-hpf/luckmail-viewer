<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckMail Viewer — 邮箱收件箱查看器</title>
    <meta name="description" content="LuckMail 邮箱收件箱在线查看器，通过 Token 查看邮件和验证码">
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background animated elements -->
    <div class="bg-gradient"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="3"/>
                        <polyline points="22,7 12,13 2,7"/>
                    </svg>
                    <span>LuckMail Viewer</span>
                </div>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="icon-btn" title="切换主题">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button id="addTokenBtn" class="btn btn-primary btn-sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加邮箱
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-layout">
            <!-- Sidebar: Email list -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>我的邮箱</h3>
                    <span class="badge" id="emailCount">0</span>
                </div>
                <div class="email-list" id="emailList">
                    <!-- Email items rendered by JS -->
                </div>
                <div class="sidebar-empty" id="sidebarEmpty">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                        <rect x="2" y="4" width="20" height="16" rx="3"/>
                        <polyline points="22,7 12,13 2,7"/>
                    </svg>
                    <p>还没有添加邮箱</p>
                    <p class="text-muted">点击「添加邮箱」开始</p>
                </div>
            </aside>

            <!-- Content area -->
            <section class="content" id="content">
                <!-- Welcome / Empty state -->
                <div class="welcome-state" id="welcomeState">
                    <div class="welcome-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                            <rect x="2" y="4" width="20" height="16" rx="3"/>
                            <polyline points="22,7 12,13 2,7"/>
                        </svg>
                    </div>
                    <h2>欢迎使用 LuckMail Viewer</h2>
                    <p>添加你的邮箱 Token，即可查看收件箱和验证码</p>
                    <button class="btn btn-primary" onclick="showAddModal()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加第一个邮箱
                    </button>
                </div>

                <!-- Loading state -->
                <div class="loading-state hidden" id="loadingState">
                    <div class="spinner"></div>
                    <p>正在加载邮件...</p>
                </div>

                <!-- Error state -->
                <div class="error-state hidden" id="errorState">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <h3>加载失败</h3>
                    <p id="errorMessage">请检查 Token 是否正确</p>
                    <button class="btn btn-outline" onclick="retryLoad()">重试</button>
                </div>

                <!-- Inbox view -->
                <div class="inbox-view hidden" id="inboxView">
                    <!-- Verification Code Card -->
                    <div class="code-card" id="codeCard">
                        <div class="code-card-header">
                            <div class="code-card-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                            <span>最新验证码</span>
                            <button class="btn btn-ghost btn-xs" onclick="refreshInbox()" title="刷新">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                                </svg>
                            </button>
                        </div>
                        <div class="code-display" id="codeDisplay">
                            <span class="code-placeholder">暂无验证码</span>
                        </div>
                        <div class="code-meta" id="codeMeta"></div>
                    </div>

                    <!-- Email info bar -->
                    <div class="email-info-bar" id="emailInfoBar">
                        <div class="email-info-address">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="3"/><polyline points="22,7 12,13 2,7"/>
                            </svg>
                            <span id="currentEmailAddress">—</span>
                            <button class="btn-copy" onclick="copyEmail()" title="复制邮箱地址">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            </button>
                        </div>
                        <div class="email-info-stats">
                            <span class="stat-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                                <span id="emailStatus">检测中</span>
                            </span>
                            <span class="stat-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <span id="mailCount">0 封邮件</span>
                            </span>
                            <span class="stat-item" id="projectBadge">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                </svg>
                                <span id="projectName">—</span>
                            </span>
                        </div>
                    </div>

                    <!-- Auto-refresh toggle -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <h3>收件箱</h3>
                        </div>
                        <div class="toolbar-right">
                            <label class="toggle-label">
                                <input type="checkbox" id="autoRefreshToggle">
                                <span class="toggle-switch"></span>
                                <span>自动刷新 (30s)</span>
                            </label>
                            <button class="btn btn-ghost btn-sm" onclick="refreshInbox()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                                </svg>
                                刷新
                            </button>
                        </div>
                    </div>

                    <!-- Mail list -->
                    <div class="mail-list" id="mailList">
                        <!-- Rendered by JS -->
                    </div>
                    <div class="mail-empty hidden" id="mailEmpty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                        </svg>
                        <p>收件箱为空</p>
                    </div>
                </div>

                <!-- Mail detail view -->
                <div class="mail-detail hidden" id="mailDetail">
                    <button class="btn btn-ghost btn-sm back-btn" onclick="closeMailDetail()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                        </svg>
                        返回收件箱
                    </button>
                    <div class="mail-detail-header">
                        <h2 id="detailSubject">—</h2>
                        <div class="mail-detail-meta">
                            <span id="detailFrom">—</span>
                            <span id="detailDate">—</span>
                        </div>
                    </div>
                    <div class="mail-detail-code hidden" id="detailCodeSection">
                        <span class="detail-code-label">验证码</span>
                        <span class="detail-code-value" id="detailCode">—</span>
                        <button class="btn-copy" onclick="copyDetailCode()" title="复制验证码">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                    <div class="mail-detail-body" id="detailBody">
                        <!-- HTML or text content -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Mobile sidebar toggle -->
        <button class="mobile-sidebar-toggle" id="mobileSidebarToggle" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </div>

    <!-- Add Token Modal -->
    <div class="modal-overlay hidden" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h3>添加邮箱</h3>
                <button class="icon-btn" onclick="closeAddModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="tokenInput">邮箱 Token</label>
                    <input type="text" id="tokenInput" placeholder="粘贴你的邮箱 Token" autocomplete="off" spellcheck="false">
                    <p class="form-hint">Token 由管理员提供，用于访问你的邮箱收件箱</p>
                </div>
                <div class="form-group">
                    <label for="labelInput">备注名称 <span class="text-muted">(可选)</span></label>
                    <input type="text" id="labelInput" placeholder="例如：工作邮箱、注册用" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary" id="confirmAddBtn" onclick="confirmAddToken()">
                    添加
                </button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
</body>
</html>
